name: 楽天ROOM 自動投稿

on:
  # Existing schedule: JST 08:00, 13:00, 21:00
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
  # .github/run-now/post.txt を更新して main に入れると即時に1回実行する
  push:
    branches: [main]
    paths:
      - ".github/run-now/post.txt"
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      target_genre:
        description: "ターゲットジャンル (general/furusato/electronics/1000yen)"
        required: false
        default: "general"
      post_count:
        description: "投稿数"
        required: false
        default: "1"
      trend_mode:
        description: "トレンドモード (true=Yahooトレンド+Gemini / false=ランキング+Groq)"
        required: false
        default: "false"

concurrency:
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: 日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Playwright Chromium をインストール
        run: npx playwright install chromium --with-deps

      - name: 自動投稿を実行
        env:
          CI: "true"
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5-mini' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROOM_COOKIE: ${{ secrets.ROOM_COOKIE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          IG_CAROUSEL_ENABLED: ${{ vars.IG_CAROUSEL_ENABLED || '1' }}
          IG_CAROUSEL_GITHUB_UPLOAD: ${{ vars.IG_CAROUSEL_GITHUB_UPLOAD || '1' }}
          IG_CAROUSEL_PUBLIC_BASE_URL: ${{ vars.IG_CAROUSEL_PUBLIC_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}/public/generated/instagram', github.repository, github.ref_name) }}
          IG_CAROUSEL_OUTPUT_DIR: ${{ vars.IG_CAROUSEL_OUTPUT_DIR || 'public/generated/instagram' }}
          AI_IMAGE_ENABLED: ${{ vars.AI_IMAGE_ENABLED || '1' }}
          AI_IMAGE_MODEL: ${{ vars.AI_IMAGE_MODEL || 'gpt-image-1-mini' }}
          AI_IMAGE_QUALITY: ${{ vars.AI_IMAGE_QUALITY || 'high' }}
          # AI画像の月額上限ガード（見積もりUSD）。上限に達した回はInstagram投稿を見送る
          AI_IMAGE_USAGE_FILE: ai_image_usage.json
          AI_IMAGE_REJECTED_DIR: ai-rejected
          AI_IMAGE_MONTHLY_BUDGET_USD: ${{ vars.AI_IMAGE_MONTHLY_BUDGET_USD || '5' }}
          AI_IMAGE_DAILY_POSTS: ${{ vars.AI_IMAGE_DAILY_POSTS || '1' }}
          AI_IMAGE_SIZE: ${{ vars.AI_IMAGE_SIZE || '1024x1024' }}
          X_DRAFT_EMAIL_TO: ${{ vars.X_DRAFT_EMAIL_TO || 'meganeojisan1984@gmail.com' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ROOM_PROFILE_URL: ${{ secrets.ROOM_PROFILE_URL || vars.ROOM_PROFILE_URL || 'https://room.rakuten.co.jp/room_sho_qoltime/items' }}
          TARGET_GENRE: ${{ github.event.inputs.target_genre || vars.TARGET_GENRE || 'general' }}
          POST_COUNT: ${{ github.event.inputs.post_count || vars.POST_COUNT || '1' }}
          TREND_MODE: ${{ github.event.inputs.trend_mode || vars.TREND_MODE || 'false' }}
          MAX_PRICE: ${{ vars.MAX_PRICE || '5000' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '1000' }}
          GENRE_ID_FURUSATO: ${{ vars.GENRE_ID_FURUSATO || '553066' }}
          GENRE_ID_ELECTRONICS: ${{ vars.GENRE_ID_ELECTRONICS || '215783' }}
        run: |
          # UTC 04時 (JST 13時) の cron 発火時のみ IG のみ (SKIP_ROOM=1)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            export SKIP_ROOM=1
            echo "[auto-post] SKIP_ROOM=1 (JST13 は IG のみ)"
          fi
          npx tsx src/main.ts

      - name: 投稿済みリストをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_items.json post_history.json agent_reports.json room_post_intent.json
          if [ -f ai_image_usage.json ]; then git add ai_image_usage.json; fi
          # Instagramは投稿時に画像を取り込むため、7日より前の生成画像はリポジトリから消す
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%d)
          for f in public/generated/instagram/*.jpg; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [[ "${name:0:10}" < "$cutoff" ]]; then git rm -q --cached --ignore-unmatch "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "no staged changes, skip commit"
            exit 0
          fi
          git commit -m "chore: 投稿済み商品リストを更新 [skip ci]"
          bash tools/safe-push.sh

      - name: エラースクリーンショットをアップロード（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot-${{ github.run_id }}
          path: error.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 検品で不合格になったAI画像をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-rejected-${{ github.run_id }}
          path: ai-rejected/
          retention-days: 7
          if-no-files-found: ignore

      - name: 実行ログをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 3
          if-no-files-found: ignore

      - name: 失敗時 Discord 通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          npx tsx -e "require('./src/notifiers.ts').notifyWorkflowFailure('auto-post', 'ジョブが失敗しました');"

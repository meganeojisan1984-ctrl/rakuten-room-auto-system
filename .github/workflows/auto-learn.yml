name: 検証済み売上サマリー (読取のみ)

on:
  schedule:
    # JST 23:45 → UTC 14:45: verified sales summary only
    - cron: "45 14 * * *"
  workflow_dispatch:

# Legacy Groq learning intentionally NOT resumed. No strategy writes or posting.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: data/sales.sqlite
          key: sales-db-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sales-db-v2-
      - run: npm ci
      - name: Read verified sales only (no AI, cookies, posting or strategy changes)
        run: npx tsx src/run_verified_sales_report.ts
      - uses: actions/upload-artifact@v4
        with:
          name: verified-sales-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/verified-sales-report.json
          retention-days: 30
          if-no-files-found: error
